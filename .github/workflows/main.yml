# Runs the checks on every push to main and, only if they pass, deploys to
# the Cloudflare Pages *staging* alias (staging.<project>.pages.dev), so
# the client only ever reviews a tested build. Production is deployed
# separately and manually after the client signs off on staging.
name: Main

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: main
  cancel-in-progress: true

permissions:
  contents: read

env:
  PAGES_PROJECT: shabbatonchoir

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/checks.yml

  deploy:
    name: Deploy to staging
    needs: checks
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.pages-deployment-alias-url || steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Deploy to staging
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: pages deploy dist --project-name=${{ env.PAGES_PROJECT }} --branch=staging --commit-hash=${{ github.sha }} --commit-dirty=true

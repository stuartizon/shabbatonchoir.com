# Lint, format, type check, build and browser tests. pr.yml and main.yml
# both call this, so the checks are defined once.
name: Checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: Lint, format, type check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run format:check

      - run: npm run check

      - run: npm run build

  browser-tests:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      # Builds the site, then runs the smoke, accessibility and link tests.
      - run: npm test

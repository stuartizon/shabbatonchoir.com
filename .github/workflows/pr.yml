# Runs the checks on each pull request and deploys it to its own Cloudflare
# Pages preview (<branch-alias>.<project>.pages.dev, where Cloudflare
# slugifies the git branch name, e.g. astro-port ->
# astro-port.<project>.pages.dev).
#
# The preview deploys alongside the checks rather than after them: a broken
# preview is only ever seen by us, and can help show what a test is
# complaining about. The checks are required in the main ruleset, so a PR
# can't merge until they pass.
name: PR

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-${{ github.event.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PAGES_PROJECT: shabbatonchoir

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/checks.yml

  preview:
    name: Deploy preview
    # Secrets aren't available to PRs from forks.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # The environment makes GitHub record a deployment, so the PR shows a
    # "View deployment" button.
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.pages-deployment-alias-url || steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Deploy preview
        id: deploy
        uses: cloudflare/wrangler-action@v4
        # wrangler-action runs the command without a shell, and git branch
        # names can't contain spaces, so interpolating head_ref is safe here.
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: pages deploy dist --project-name=${{ env.PAGES_PROJECT }} --branch=${{ github.head_ref }} --commit-hash=${{ github.event.pull_request.head.sha }} --commit-dirty=true

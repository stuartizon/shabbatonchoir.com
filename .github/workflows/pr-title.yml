# The PR title becomes the squash commit message on main, so it has to be
# gitmoji style too. This is a separate workflow because it also runs
# when the title is edited, and that shouldn't re-run the other checks.
name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  title:
    name: PR title is gitmoji style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # The title goes through an environment variable, never straight
      # into the script, so it can't inject shell commands.
      - run: printf '%s' "$TITLE" | node scripts/check-commit-msg.js
        env:
          TITLE: ${{ github.event.pull_request.title }}

# Deploys each pull request to its own Cloudflare Pages preview
# (pr-<number>.<project>.pages.dev) and posts the link on the PR.
name: Deploy PR preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: deploy-preview-${{ github.event.number }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write
  pull-requests: write

env:
  PAGES_PROJECT: shabbatonchoir

jobs:
  deploy:
    # Secrets aren't available to PRs from forks.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --frozen-lockfile

      - run: yarn export

      - name: Create the Pages project if it doesn't exist yet
        run: npx --yes wrangler@4 pages project create "$PAGES_PROJECT" --production-branch=main || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy preview
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: pages deploy out --project-name=${{ env.PAGES_PROJECT }} --branch=pr-${{ github.event.number }} --commit-hash=${{ github.event.pull_request.head.sha }} --commit-dirty=true

      - name: Comment the preview link on the PR
        uses: actions/github-script@v7
        env:
          ALIAS_URL: ${{ steps.deploy.outputs.deployment-alias-url }}
          DEPLOY_URL: ${{ steps.deploy.outputs.deployment-url }}
        with:
          script: |
            const marker = '<!-- cloudflare-preview -->';
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const body = [
              marker,
              '### 🔍 Preview',
              '',
              `**${process.env.ALIAS_URL || process.env.DEPLOY_URL}**`,
              '',
              `This deploy is for \`${sha}\` (${process.env.DEPLOY_URL}). The link above always shows the latest commit on this PR.`,
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.user.type === 'Bot' && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

name: Bilvavi
hebrewName: בלבבי
year: 2006
cover: ./bilvavi.jpeg
description: >-
  The raison d’être of the choir is to "sing a new song" and the new CD follows
  in this tradition. It is a synthesis of old and contemporary Jewish liturgical
  and folk music. The CD features the well known synagogue pieces, "Tsadik
  Katamar" and "Uv’nucho Yomar". A new arrangement of the Pesach prayer "Tal"
  and also the title track "Bilvavi" are both contemporary pieces written by the
  choir’s musical director Stephen Levey. Amongst the other pieces are the
  beautiful Talmon "Ein Keloheinu", the evocative "Lo Teida Milchama" and an up
  beat arrangement of "Shehecheyanu".

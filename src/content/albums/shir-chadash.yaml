name: Shir Chadash
year: 2003
cover: ./shir-chadash.gif
description: >-
  The Shabbaton Choir plays to packed houses in concert; performing before
  thousands of people each year. Now you can bring the sound of the Shabbaton
  Choir into your living rooms. Recorded at studios in London this CD contains
  some of the Choir's best known concert repertoire and features soloists Lionel
  Rosenfeld and Shimon Craimer. The CD encapsulates the distinctive style of
  Jewish music as performed by the Shabbaton Choir. Many of the pieces are
  arranged by Stephen Glass and sung in the inimitable "Shabbaton style". From
  the modern to the old; the soft to the loud, the devotional to the celebratory
  this CD has something for everyone.

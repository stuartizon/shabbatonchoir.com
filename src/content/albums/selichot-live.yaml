name: Selichot Live
year: 2001
cover: ./selichot-live.jpeg
description: >-
  Recorded in front of a packed Holy Law South Broughton Congregation in
  Manchester, this CD combines the talents of the Shabbaton Choir with soloists
  Lionel Rosenfeld and Shimon Craimer. The CD captures the atmosphere of the
  United Synagogue's Choral Midnight Selichot Service for which the Shabbaton
  Choir has become internationally renowned.
